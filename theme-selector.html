<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Gallery - SmartReader</title>
  <link rel="stylesheet" href="themes.css">
  <style>
    /* Theme Selector Specific Styles */
    .theme-gallery {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .gallery-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .gallery-header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .gallery-header p {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    .theme-categories {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .category-btn {
      padding: 10px 20px;
      border: 2px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-primary);
      cursor: pointer;
      border-radius: var(--border-radius);
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .category-btn:hover {
      border-color: var(--accent-primary);
      background: var(--accent-primary);
      color: var(--bg-primary);
    }

    .category-btn.active {
      background: var(--accent-primary);
      color: var(--bg-primary);
      border-color: var(--accent-primary);
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .theme-card {
      background: var(--bg-secondary);
      border: 2px solid var(--border-color);
      border-radius: var(--border-radius);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .theme-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent-primary);
    }

    .theme-card.selected {
      border-color: var(--accent-primary);
      border-width: 3px;
      box-shadow: 0 0 20px var(--shadow-color);
    }

    .theme-preview {
      height: 150px;
      position: relative;
      overflow: hidden;
    }

    .theme-preview-content {
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .preview-bar {
      height: 30px;
      border-radius: 4px;
      opacity: 0.9;
    }

    .preview-text {
      height: 15px;
      border-radius: 4px;
      opacity: 0.7;
    }

    .theme-info {
      padding: 16px;
    }

    .theme-name {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .theme-description {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .theme-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .theme-tag {
      padding: 4px 10px;
      background: var(--bg-tertiary);
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .selected-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--accent-primary);
      color: var(--bg-primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      box-shadow: 0 2px 8px var(--shadow-color);
    }

    .apply-button {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 16px 32px;
      background: var(--accent-primary);
      color: var(--bg-primary);
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--shadow-color);
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .apply-button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px var(--shadow-color);
    }

    .current-theme-display {
      text-align: center;
      padding: 20px;
      background: var(--bg-secondary);
      border-radius: var(--border-radius);
      margin-bottom: 30px;
      border: 2px solid var(--border-color);
    }

    .current-theme-display h3 {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .current-theme-display .theme-name {
      font-size: 1.5rem;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .theme-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }

      .gallery-header h1 {
        font-size: 2rem;
      }

      .apply-button {
        bottom: 20px;
        right: 20px;
        padding: 12px 24px;
        font-size: 1rem;
      }
    }

    /* Loading animation */
    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    .loading .theme-card {
      background: linear-gradient(
        90deg,
        var(--bg-secondary) 0%,
        var(--bg-tertiary) 50%,
        var(--bg-secondary) 100%
      );
      background-size: 1000px 100%;
      animation: shimmer 2s infinite;
    }
  </style>
</head>
<body>
  <div class="theme-gallery">
    <!-- Header -->
    <div class="gallery-header">
      <h1>🎨 테마 갤러리</h1>
      <p>20가지 감성 스킨으로 나만의 학습 환경을 만들어보세요</p>
    </div>

    <!-- Current Theme Display -->
    <div class="current-theme-display">
      <h3>현재 테마</h3>
      <div class="theme-name" id="current-theme-name">기본 테마</div>
    </div>

    <!-- Category Filters -->
    <div class="theme-categories">
      <button class="category-btn active" data-category="all">전체</button>
      <button class="category-btn" data-category="student">학생</button>
      <button class="category-btn" data-category="retro">레트로</button>
      <button class="category-btn" data-category="professional">전문가</button>
      <button class="category-btn" data-category="nature">자연</button>
      <button class="category-btn" data-category="special">특수</button>
    </div>

    <!-- Theme Grid -->
    <div class="theme-grid" id="theme-grid">
      <!-- Themes will be dynamically generated here -->
    </div>

    <!-- Apply Button -->
    <button class="apply-button" id="apply-theme-btn">
      테마 적용하기 ✨
    </button>
  </div>

  <script src="theme-selector.js"></script>
</body>
</html>
